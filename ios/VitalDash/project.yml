name: VitalDash
options:
  bundleIdPrefix: com.morganserver
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  VitalDash:
    type: application
    platform: iOS
    sources:
      - path: VitalDash
    info:
      path: VitalDash/App/Info.plist
      properties:
        CFBundleDisplayName: VitalDash
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "VitalDash uses Face ID to sign you in securely."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morganserver.vitaldash
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
